<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JavaScript Boolean</title>
</head>
<body>

<script>
  let x = 5;
  let y = 10;

  // Boolean true / false
  console.log(x > y);   // false
  console.log(x < y);   // true

  // Menggunakan Boolean()
  let result = Boolean(0);
  console.log(result);  // false

  result = Boolean("Hello");
  console.log(result);  // true
</script>

</body>
</html>
