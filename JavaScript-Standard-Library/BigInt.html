<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>JavaScript BigInt Example</title>
</head>
<body>
  <script>
    // Membuat BigInt
    const bigNumber = 9007199254740991n;
    console.log("Nilai BigInt:", bigNumber);

    // Operasi aritmatika dengan BigInt
    const sum = bigNumber + 1n;
    console.log("Tambah 1:", sum);

    const difference = bigNumber - 10n;
    console.log("Kurang 10:", difference);

    // BigInt lebih besar dari Number aman
    const reallyBig = 123456789012345678901234567890n;
    console.log("Angka sangat besar:", reallyBig);
  </script>

</body>
</html>
