<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JavaScript Date</title>
</head>
<body>

<script>
  // Membuat objek Date
  const sekarang = new Date();
  console.log("Tanggal sekarang:", sekarang);

  // Mendapatkan bagian tanggal
  console.log("Tahun:", sekarang.getFullYear());
  console.log("Bulan (0-11):", sekarang.getMonth());
  console.log("Tanggal:", sekarang.getDate());
  console.log("Jam:", sekarang.getHours());
  console.log("Menit:", sekarang.getMinutes());

  // Mengubah tanggal
  sekarang.setFullYear(2025);
  console.log("Tanggal setelah diubah:", sekarang);
</script>

</body>
</html>
