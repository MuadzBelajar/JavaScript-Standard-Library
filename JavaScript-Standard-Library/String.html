<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JavaScript String</title>
</head>
<body>

<script>
  const text = "Hello, JavaScript!";

  // Panjang string
  console.log("Panjang:", text.length);

  // Mengubah menjadi uppercase
  console.log("Uppercase:", text.toUpperCase());

  // Mengubah menjadi lowercase
  console.log("Lowercase:", text.toLowerCase());

  // Mengambil substring
  console.log("Substring (0–5):", text.substring(0, 5));

  // Replace teks
  const newText = text.replace("JavaScript", "World");
  console.log("Replace:", newText);

  // Menggabungkan string
  const greet = "Hi";
  console.log("Concat:", greet.concat(", everyone!"));
</script>

</body>
</html>
