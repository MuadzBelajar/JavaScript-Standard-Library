<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JavaScript Set</title>
</head>
<body>

<script>
  const mySet = new Set();

  // Tambah nilai ke Set
  mySet.add(1);
  mySet.add(2);
  mySet.add(2); // Tidak akan ditambah karena duplikat
  mySet.add(3);

  console.log("Isi Set:", mySet);

  // Cek apakah nilai ada di Set
  console.log("Ada 2?", mySet.has(2));

  // Hapus nilai
  mySet.delete(1);
  console.log("Setelah delete 1:", mySet);

  // Ukuran Set
  console.log("Ukuran Set:", mySet.size);

  // Looping Set
  for (const value of mySet) {
    console.log("Value:", value);
  }
</script>

</body>
</html>
