<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JavaScript Math</title>
</head>
<body>

<script>
  // Menggunakan Math untuk operasi matematika
  console.log("Nilai absolut dari -5:", Math.abs(-5));
  console.log("Akar kuadrat dari 25:", Math.sqrt(25));
  console.log("Pembulatan ke atas:", Math.ceil(4.2));
  console.log("Pembulatan ke bawah:", Math.floor(4.8));
  console.log("Angka acak antara 0 dan 1:", Math.random());

  // Contoh random dalam rentang
  const random100 = Math.floor(Math.random() * 100) + 1;
  console.log("Angka random 1–100:", random100);
</script>

</body>
</html>
